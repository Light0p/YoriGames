      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A225A" />
      <stop offset="100%" stop-color="#120E2E" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#1A153A" rx="100"/>

  <g transform="translate(0, 20)">
      <path d="M 110 180 C 110 130, 200 120, 256 140 C 312 120, 402 130, 402 180 Z" fill="#E046B1" filter="url(#neonGlow)"/>
      
