<!DOCTYPE html>
<html>
<head>
    <title>Sudoku</title>
    <style>
        body { background: #09061B; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .grid { display: grid; grid-template-columns: repeat(9, 1fr); background: #1B123D; border: 4px solid #22D3EE; box-shadow: 0 0 20px rgba(34, 211, 238, 0.2); }
        .cell { width: 35px; height: 35px; border: 1px solid #140A2E; text-align: center; font-size: 18px; line-height: 35px; cursor: pointer; background: #09061B; transition: background 0.2s; }
        @media (min-width: 600px) { .cell { width: 50px; height: 50px; line-height: 50px; font-size: 24px; } }
        .cell:nth-child(3n) { border-right: 2px solid #22D3EE; }
        .cell:nth-child(9n) { border-right: none; }
        .grid > div:nth-child(n+19):nth-child(-n+27), .grid > div:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid #22D3EE; }
        .cell.selected { background: #140A2E; color: #22D3EE; }
        .cell.fixed { color: #A855F7; font-weight: bold; }
        .controls { margin-top: 20px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        .num-btn { padding: 10px; background: #1B123D; border: 1px solid #22D3EE; color: white; cursor: pointer; font-weight: bold; }
        .num-btn:hover { background: #22D3EE; color: black; }
        .status { margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; color: #A855F7; }
    </style>
</head>
<body>
    <div class="status" id="status">SOLVE THE MATRIX</div>
    <div class="grid" id="grid"></div>
    <div class="controls">
        <button class="num-btn" onclick="inputNum(1)">1</button>
        <button class="num-btn" onclick="inputNum(2)">2</button>
        <button class="num-btn" onclick="inputNum(3)">3</button>
        <button class="num-btn" onclick="inputNum(4)">4</button>
        <button class="num-btn" onclick="inputNum(5)">5</button>
        <button class="num-btn" onclick="inputNum(6)">6</button>
        <button class="num-btn" onclick="inputNum(7)">7</button>
        <button class="num-btn" onclick="inputNum(8)">8</button>
        <button class="num-btn" onclick="inputNum(9)">9</button>
        <button class="num-btn" onclick="inputNum(0)">DEL</button>
    </div>
    <script>
        const initialGrid = [
            [5,3,0,0,7,0,0,0,0],
            [6,0,0,1,9,5,0,0,0],
            [0,9,8,0,0,0,0,6,0],
            [8,0,0,0,6,0,0,0,3],
            [4,0,0,8,0,3,0,0,1],
            [7,0,0,0,2,0,0,0,6],
            [0,6,0,0,0,0,2,8,0],
            [0,0,0,4,1,9,0,0,5],
            [0,0,0,0,8,0,0,7,9]
        ];
        let currentGrid = JSON.parse(JSON.stringify(initialGrid));
        let selectedCell = null;

        function createGrid() {
            const gridEl = document.getElementById('grid');
            gridEl.innerHTML = '';
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if (initialGrid[r][c] !== 0) {
                        cell.innerText = initialGrid[r][c];
                        cell.classList.add('fixed');
                    }
                    cell.onclick = () => selectCell(r, c, cell);
                    gridEl.appendChild(cell);
                }
            }
        }

        function selectCell(r, c, el) {
            if (initialGrid[r][c] !== 0) return;
            if (selectedCell) selectedCell.el.classList.remove('selected');
            selectedCell = { r, c, el };
            el.classList.add('selected');
        }

        function inputNum(num) {
            if (!selectedCell) return;
            selectedCell.el.innerText = num === 0 ? '' : num;
            currentGrid[selectedCell.r][selectedCell.c] = num;
            checkWin();
        }

        function checkWin() {
            // Simple validation could go here
            if (currentGrid.every(row => row.every(c => c !== 0))) {
                document.getElementById('status').innerText = "GRID COMPLETE!";
            }
        }

        document.addEventListener('keydown', (e) => {
            const num = parseInt(e.key);
            if (!isNaN(num) && num >= 1 && num <= 9) inputNum(num);
            if (e.key === 'Backspace' || e.key === 'Delete') inputNum(0);
        });

        createGrid();
    </script>
</body>
</html>
