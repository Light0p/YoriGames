<!DOCTYPE html>
<html>
<head>
    <title>Checkers</title>
    <style>
        body { background: #09061B; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .board { display: grid; grid-template-columns: repeat(8, 1fr); background: #140A2E; border: 4px solid #A855F7; }
        .cell { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        @media (min-width: 600px) { .cell { width: 60px; height: 60px; } }
        .cell.dark { background: #1B123D; }
        .cell.light { background: #09061B; }
        .piece { width: 80%; height: 80%; border-radius: 50%; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        .piece.red { background: #EC4899; }
        .piece.white { background: #FFFFFF; }
        .piece.king { border: 3px solid #FFD34D; }
        .cell.selected { background: #A855F733; }
        .status { margin-bottom: 20px; font-weight: bold; color: #EC4899; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="status" id="status">RED MOVES FIRST</div>
    <div class="board" id="board"></div>
    <script>
        const boardEl = document.getElementById('board');
        let board = [];
        let selected = null;
        let turn = 'red';

        function init() {
            for (let r = 0; r < 8; r++) {
                board[r] = [];
                for (let c = 0; c < 8; c++) {
                    let piece = null;
                    if ((r + c) % 2 === 1) {
                        if (r < 3) piece = { color: 'white', king: false };
                        else if (r > 4) piece = { color: 'red', king: false };
                    }
                    board[r][c] = piece;
                }
            }
            render();
        }

        function render() {
            boardEl.innerHTML = '';
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const cell = document.createElement('div');
                    cell.className = `cell ${(r + c) % 2 === 1 ? 'dark' : 'light'}`;
                    if (selected && selected.r === r && selected.c === c) cell.classList.add('selected');
                    
                    if (board[r][c]) {
                        const piece = document.createElement('div');
                        piece.className = `piece ${board[r][c].color} ${board[r][c].king ? 'king' : ''}`;
                        cell.appendChild(piece);
                    }
                    
                    cell.onclick = () => handleCell(r, c);
                    boardEl.appendChild(cell);
                }
            }
        }

        function handleCell(r, c) {
            const piece = board[r][c];
            if (piece && piece.color === turn) {
                selected = { r, c };
            } else if (selected && !piece && (r + c) % 2 === 1) {
                // Simplified move logic: only diagonal one step
                const dr = r - selected.r;
                const dc = Math.abs(c - selected.c);
                const forward = turn === 'red' ? -1 : 1;
                
                if (dc === 1 && (dr === forward || board[selected.r][selected.c].king)) {
                    board[r][c] = board[selected.r][selected.c];
                    board[selected.r][selected.c] = null;
                    if ((turn === 'red' && r === 0) || (turn === 'white' && r === 7)) board[r][c].king = true;
                    turn = turn === 'red' ? 'white' : 'red';
                    selected = null;
                    document.getElementById('status').innerText = `${turn.toUpperCase()} TURN`;
                    document.getElementById('status').style.color = turn === 'red' ? '#EC4899' : '#FFFFFF';
                }
            }
            render();
        }

        init();
    </script>
</body>
</html>
